apis:
- name: Montonio Payments API (Stargate)
  description: >-
    JWT-authenticated REST API for collecting payments (bank payment initiation,
    cards, MobilePay, BLIK, BNPL / Hire-Purchase), creating and validating
    Orders, issuing Refunds, generating Payment Links, opening embedded checkout
    Sessions, listing available payment methods, and retrieving payout report
    statements. HS256 JWTs carry the request payload for POST endpoints.
  humanURL: https://docs.montonio.com/api/stargate/overview
  baseURL: https://stargate.montonio.com/api
  tags:
  - Payments
  - Orders
  - Refunds
  - Financing
  properties:
  - type: Documentation
    url: https://docs.montonio.com/api/stargate/overview
  - type: APIReference
    url: https://docs.montonio.com/api/stargate/reference
  - type: GettingStarted
    url: https://docs.montonio.com/api/stargate/checklist
  - type: Webhooks
    url: https://docs.montonio.com/api/stargate/guides/webhooks
- name: Montonio Shipping API (v2)
  description: >-
    JWT-authenticated REST API for multi-carrier shipping: list carriers and
    shipping methods, fetch pickup points and courier services, calculate rates,
    create and update Shipments, generate and fetch Label Files, and manage
    Webhooks. Uses Bearer HS256 JWTs signed with the store Secret Key.
  humanURL: https://docs.montonio.com/api/shipping-v2/overview
  baseURL: https://shipping.montonio.com/api/v2
  tags:
  - Shipping
  - Logistics
  - Labels
  - Tracking
  properties:
  - type: Documentation
    url: https://docs.montonio.com/api/shipping-v2/overview
  - type: APIReference
    url: https://docs.montonio.com/api/shipping-v2/reference
  - type: Webhooks
    url: https://docs.montonio.com/api/shipping-v2/guides/webhooks
