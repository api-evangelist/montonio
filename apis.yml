description: >-
  Montonio is an Estonian fintech providing a unified payments and shipping
  platform for e-commerce merchants across the Baltics, Poland, and Finland. Its
  developer platform exposes two JWT-authenticated REST APIs: the Payments API
  (Stargate) for bank payment initiation, card payments, MobilePay, BLIK, and
  Buy-Now-Pay-Later / Hire-Purchase financing, together with orders, refunds,
  payment links, checkout sessions and payout reporting; and the Shipping API
  (v2) for multi-carrier label printing, parcel tracking, pickup points, and
  shipment management. Montonio serves over 8,000 businesses, ships ready-made
  plugins for WooCommerce, Magento and PrestaShop, and publishes a first-party
  JavaScript SDK with embeddable checkout UI components.
