keys: >-
  Sandbox and Production API keys are issued separately from the Partner System
  (Stores -> API Keys). Sandbox keys are available immediately after signup;
  production keys unlock after business approval.
sandbox_behavior:
- Shipping sandbox does not call real carrier APIs; responses are mocked and labels are dummy.
- Carrier activation in sandbox accepts any dummy credentials.
- POST /shipments does not validate phone numbers or address data in sandbox.
- Tracking Page renders but shows no real-time tracking (nothing is actually shipped).
- Test mode must be activated in the Partner System before using the sandbox.
