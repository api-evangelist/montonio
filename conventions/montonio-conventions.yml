idempotency:
  supported: true
  scope: "POST /refunds (Stargate)"
  mechanism: >-
    Refund requests carry a client-generated `idempotencyKey` (recommended V4
    UUID) in the token payload. Montonio recognizes retries with the same key and
    rejects a second distinct refund attempt reusing a key with HTTP 400
    ("already has a refund with same idempotency key"). Montonio recommends
    storing the key to prevent duplicate refunds.
  header: null
  field: idempotencyKey
